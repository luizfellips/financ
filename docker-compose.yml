services:
  db:
    image: postgres:16-alpine
    container_name: financ-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financ
      POSTGRES_PASSWORD: financ
      POSTGRES_DB: financ
    # Not published to the host — reach via the compose network or:
    #   docker compose exec db psql -U financ -d financ
    volumes:
      - financ_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financ -d financ"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financ-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://financ:financ@db:5432/financ?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random string of at least 32 characters}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET (can match AUTH_SECRET)}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@financ.app}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Demo@123456}
      SEED_USER_NAME: ${SEED_USER_NAME:-Usuário Demo}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  financ_pg_data:
